baseURL = "https://tartagalensis.github.io/"
locale = "es-AR"
defaultContentLanguage = "es"
title = "Tartagalensis"
theme = "tartagalensis"
removePathAccents = true
enableRobotsTXT = true
ignoreFiles = ["\\.Rmd$", "\\.Rmarkdown$", "_cache$", "\\.knit\\.md$", "\\.utf8\\.md$"]

[permalinks]
  notas = "/notas/:slug/"

[taxonomies]
  tema = "temas"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[params]
  description = "Mis dos centavos sobre lo que pasa, desde el Norte."
  autor = "Franco Galeano"
  buttondown = "tartagalensis"
  linkedin = "https://www.linkedin.com/in/franco-galeano-arg/"
  github = "https://github.com/tartagalensis"

[markup.goldmark.renderer]
  unsafe = true

# Las notas viejas de blogdown son .html renderizados desde .Rmd
[security]
  allowContent = ['.*']
